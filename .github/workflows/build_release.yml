name: Build Release

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*' # Builds trigger when pushing a version tag

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.7'
          
      - name: Enable Windows Support
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Install Dependencies
        run: flutter pub get
        
      - name: Run Static Analysis
        run: flutter analyze
        
      - name: Run Unit Tests
        run: flutter test
        
      - name: Build Windows Executable
        run: flutter build windows --release
        
      - name: Zip Bundle
        run: |
          $refName = "${{ github.ref_name }}"
          $sanitizedName = $refName -replace '/', '-'
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "sqa-multitools-$sanitizedName-windows.zip"
        
      - name: Upload Artifact Map
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: sqa-multitools-*-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.7'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev file libglib2.0-bin libglib2.0-dev cmake pkg-config libsecret-1-dev libjsoncpp-dev libkeybinder-3.0-dev libayatana-appindicator3-dev libdbus-1-dev libmpv-dev

      - name: Enable Linux Desktop
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release Bundle
        run: flutter build linux --release

      - name: Package AppImage with linuxdeploy
        run: |
          # Setup AppDir
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          # Download linuxdeploy tools
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          # Prepare Icon
          cp assets/app_icon_linux.png sqa_multitools.png

          # Run linuxdeploy
          REF_NAME="${{ github.ref_name }}"
          SANITIZED_NAME="${REF_NAME//\//-}"
          export OUTPUT="sqa-multitools-${SANITIZED_NAME}-linux.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/sqa_multitools \
            --desktop-file linux/sqa_multitools.desktop \
            --icon-file sqa_multitools.png \
            --plugin gtk \
            --output appimage

      - name: Upload Artifact Map
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: sqa-multitools-*-linux.AppImage

  create-release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sqa-multitools-*.zip
            sqa-multitools-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
